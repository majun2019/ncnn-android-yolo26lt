<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="180mm" height="168mm" viewBox="0 0 1800 1680" role="img" aria-labelledby="title desc">
  <title id="title">Figure 6. Effect of Single vs. Repeated Sigmoid Application on Background Scores</title>
  <desc id="desc">A comparison of the normal probability branch and repeated sigmoid application, showing that small background probabilities are lifted to approximately 0.5 while foreground scores are compressed.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f9fbfd"/>
      <stop offset="100%" stop-color="#eef4f7"/>
    </linearGradient>
    <linearGradient id="sourceStage" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#edf5ff"/>
      <stop offset="100%" stop-color="#dceafa"/>
    </linearGradient>
    <linearGradient id="normalStage" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ebf8f0"/>
      <stop offset="100%" stop-color="#daf0e2"/>
    </linearGradient>
    <linearGradient id="faultStage" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff6e4"/>
      <stop offset="100%" stop-color="#ffe2be"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="9" stdDeviation="9" flood-color="#23303a" flood-opacity="0.14"/>
    </filter>
    <marker id="arrowBlue" markerWidth="22" markerHeight="22" refX="18" refY="11" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2,2 L20,11 L2,20 Z" fill="#315b7d"/>
    </marker>
    <marker id="arrowGreen" markerWidth="22" markerHeight="22" refX="18" refY="11" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2,2 L20,11 L2,20 Z" fill="#377b45"/>
    </marker>
    <marker id="arrowOrange" markerWidth="22" markerHeight="22" refX="18" refY="11" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2,2 L20,11 L2,20 Z" fill="#a66b15"/>
    </marker>
    <style><![CDATA[
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 41px; font-weight: 700; fill: #17212b; }
      .subtitle { font-family: Arial, Helvetica, sans-serif; font-size: 25px; fill: #536170; }
      .stage-title { font-family: Arial, Helvetica, sans-serif; font-size: 29px; font-weight: 700; fill: #182430; }
      .body { font-family: Arial, Helvetica, sans-serif; font-size: 23px; fill: #314151; }
      .note { font-family: Arial, Helvetica, sans-serif; font-size: 20px; fill: #526273; }
      .good { font-family: Arial, Helvetica, sans-serif; font-size: 25px; font-weight: 700; fill: #2f6f3e; }
      .bad { font-family: Arial, Helvetica, sans-serif; font-size: 25px; font-weight: 700; fill: #8a4c14; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 24px; font-weight: 700; fill: #ffffff; }
    ]]></style>
  </defs>

  <rect x="0" y="0" width="1800" height="1680" fill="url(#background)"/>
  <rect x="100" y="78" width="1600" height="152" rx="18" fill="#ffffff" stroke="#d7e0ea" stroke-width="3"/>
  <text x="900" y="138" text-anchor="middle" class="title">Single vs. Repeated Sigmoid on Candidate Scores</text>
  <text x="900" y="184" text-anchor="middle" class="subtitle">Repeated activation lifts background scores and compresses foreground dynamic range</text>

  <g filter="url(#shadow)">
    <rect x="520" y="300" width="760" height="155" rx="20" fill="url(#sourceStage)" stroke="#89a9cf" stroke-width="3"/>
    <text x="900" y="362" text-anchor="middle" class="stage-title">Model graph already outputs probability p</text>
    <text x="900" y="407" text-anchor="middle" class="body">The parser should not apply another sigmoid to this branch</text>
  </g>

  <path d="M780 470 C650 555 520 610 430 700" stroke="#377b45" stroke-width="7" fill="none" marker-end="url(#arrowGreen)" stroke-linecap="round"/>
  <path d="M1020 470 C1150 555 1280 610 1370 700" stroke="#a66b15" stroke-width="7" fill="none" marker-end="url(#arrowOrange)" stroke-linecap="round"/>

  <g filter="url(#shadow)">
    <rect x="130" y="710" width="720" height="560" rx="20" fill="#ffffff" stroke="#9bc7a3" stroke-width="3"/>
    <rect x="130" y="710" width="720" height="92" rx="20" fill="url(#normalStage)" stroke="#9bc7a3" stroke-width="0"/>
    <text x="490" y="768" text-anchor="middle" class="stage-title">Correct Single-Activation Path</text>
    <text x="190" y="872" class="body">Background location</text>
    <text x="190" y="914" class="note">model output p = 0.0006</text>
    <text x="590" y="914" text-anchor="middle" class="good">kept as 0.0006</text>
    <line x1="190" y1="960" x2="790" y2="960" stroke="#d6e6d9" stroke-width="3"/>
    <text x="190" y="1028" class="body">Foreground location</text>
    <text x="190" y="1070" class="note">model output p = 0.9000</text>
    <text x="590" y="1070" text-anchor="middle" class="good">kept as 0.9000</text>
    <rect x="190" y="1144" width="600" height="78" rx="14" fill="#f3fbf5" stroke="#9bc7a3" stroke-width="2"/>
    <text x="490" y="1192" text-anchor="middle" class="good">background remains near zero</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="950" y="710" width="720" height="560" rx="20" fill="#ffffff" stroke="#e0c48f" stroke-width="3"/>
    <rect x="950" y="710" width="720" height="92" rx="20" fill="url(#faultStage)" stroke="#e0c48f" stroke-width="0"/>
    <text x="1310" y="768" text-anchor="middle" class="stage-title">Faulty Repeated-Activation Path</text>
    <text x="1010" y="872" class="body">Background location</text>
    <text x="1010" y="914" class="note">sigmoid(0.0006)</text>
    <text x="1410" y="914" text-anchor="middle" class="bad">0.5001</text>
    <line x1="1010" y1="960" x2="1610" y2="960" stroke="#ead3a6" stroke-width="3"/>
    <text x="1010" y="1028" class="body">Foreground location</text>
    <text x="1010" y="1070" class="note">sigmoid(0.9000)</text>
    <text x="1410" y="1070" text-anchor="middle" class="bad">0.7109</text>
    <rect x="1010" y="1144" width="600" height="78" rx="14" fill="#fff8eb" stroke="#e0c48f" stroke-width="2"/>
    <text x="1310" y="1192" text-anchor="middle" class="bad">dense pseudo-candidates appear</text>
  </g>

  <path d="M490 1292 C610 1344 770 1362 878 1376" stroke="#315b7d" stroke-width="7" fill="none" marker-end="url(#arrowBlue)" stroke-linecap="round"/>
  <path d="M1310 1292 C1190 1344 1030 1362 922 1376" stroke="#315b7d" stroke-width="7" fill="none" marker-end="url(#arrowBlue)" stroke-linecap="round"/>

  <g filter="url(#shadow)">
    <rect x="250" y="1390" width="1300" height="126" rx="18" fill="#ffffff" stroke="#d7e0ea" stroke-width="3"/>
    <text x="900" y="1442" text-anchor="middle" class="stage-title">Diagnosis implication</text>
    <text x="900" y="1488" text-anchor="middle" class="body">A stable 50% confidence field is an activation-semantics fault, not a threshold-tuning problem.</text>
  </g>
</svg>