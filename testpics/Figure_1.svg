<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="180mm" height="262mm" viewBox="0 0 1800 2620" role="img" aria-labelledby="title desc">
  <title id="title">Figure 1. Model Export and On-Device Validation Closed Loop</title>
  <desc id="desc">An eight-stage closed-loop workflow from PyTorch multi-task weights through export, asset generation, structural verification, Android deployment, on-device execution, logging and cross-backend comparison, and regression validation.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f9fbfd"/>
      <stop offset="100%" stop-color="#eef4f7"/>
    </linearGradient>
    <linearGradient id="modelStage" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#edf5ff"/>
      <stop offset="100%" stop-color="#dceafa"/>
    </linearGradient>
    <linearGradient id="verificationStage" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ebf8f0"/>
      <stop offset="100%" stop-color="#daf0e2"/>
    </linearGradient>
    <linearGradient id="androidStage" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff6e4"/>
      <stop offset="100%" stop-color="#ffe8bd"/>
    </linearGradient>
    <linearGradient id="diagnosisStage" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f7fb"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="9" stdDeviation="9" flood-color="#23303a" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="22" markerHeight="22" refX="18" refY="11" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2,2 L20,11 L2,20 Z" fill="#315b7d"/>
    </marker>
    <marker id="loopArrow" markerWidth="24" markerHeight="24" refX="20" refY="12" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2,2 L22,12 L2,22 Z" fill="#8a5b16"/>
    </marker>
    <style><![CDATA[
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 46px; font-weight: 700; fill: #17212b; }
      .subtitle { font-family: Arial, Helvetica, sans-serif; font-size: 26px; fill: #536170; }
      .lane { font-family: Arial, Helvetica, sans-serif; font-size: 22px; font-weight: 700; letter-spacing: 1px; fill: #667687; }
      .stage-title { font-family: Arial, Helvetica, sans-serif; font-size: 31px; font-weight: 700; fill: #182430; }
      .body { font-family: Arial, Helvetica, sans-serif; font-size: 23px; fill: #314151; }
      .note { font-family: Arial, Helvetica, sans-serif; font-size: 21px; fill: #526273; }
      .num { font-family: Arial, Helvetica, sans-serif; font-size: 28px; font-weight: 700; fill: #ffffff; }
      .loop-title { font-family: Arial, Helvetica, sans-serif; font-size: 24px; font-weight: 700; fill: #73501b; }
      .loop-text { font-family: Arial, Helvetica, sans-serif; font-size: 20px; fill: #5f6d78; }
    ]]></style>
  </defs>

  <rect x="0" y="0" width="1800" height="2620" fill="url(#background)"/>

  <rect x="100" y="78" width="1600" height="152" rx="18" fill="#ffffff" stroke="#d7e0ea" stroke-width="3"/>
  <text x="900" y="138" text-anchor="middle" class="title">Model Export and On-Device Validation Closed Loop</text>
  <text x="900" y="184" text-anchor="middle" class="subtitle">From PyTorch multi-task weights to Android real-device validation evidence</text>

  <text x="160" y="318" text-anchor="middle" class="lane">
    <tspan x="160" dy="0">MODEL</tspan>
    <tspan x="160" dy="28">PREPARATION</tspan>
  </text>
  <text x="160" y="1070" text-anchor="middle" class="lane">
    <tspan x="160" dy="0">STRUCTURAL</tspan>
    <tspan x="160" dy="28">CHECKS</tspan>
  </text>
  <text x="160" y="1538" text-anchor="middle" class="lane">
    <tspan x="160" dy="0">ANDROID</tspan>
    <tspan x="160" dy="28">DEPLOYMENT</tspan>
  </text>
  <text x="160" y="2096" text-anchor="middle" class="lane">
    <tspan x="160" dy="0">DIAGNOSIS</tspan>
    <tspan x="160" dy="28">AND REGRESSION</tspan>
  </text>

  <!-- Stage 1 -->
  <g filter="url(#shadow)">
    <rect x="270" y="300" width="1040" height="168" rx="20" fill="url(#modelStage)" stroke="#89a9cf" stroke-width="3"/>
    <circle cx="338" cy="384" r="38" fill="#315b7d"/>
    <text x="338" y="394" text-anchor="middle" class="num">1</text>
    <text x="412" y="360" class="stage-title">Training or Fine-Tuned Weights</text>
    <text x="412" y="403" class="body">PyTorch multi-task weights</text>
    <text x="412" y="440" class="note">Detection / segmentation / pose / classification / OBB</text>
  </g>

  <path d="M790 482 L790 535" stroke="#315b7d" stroke-width="7" fill="none" marker-end="url(#arrow)" stroke-linecap="round"/>

  <!-- Stage 2 -->
  <g filter="url(#shadow)">
    <rect x="270" y="550" width="1040" height="205" rx="20" fill="url(#modelStage)" stroke="#89a9cf" stroke-width="3"/>
    <circle cx="338" cy="652" r="38" fill="#315b7d"/>
    <text x="338" y="662" text-anchor="middle" class="num">2</text>
    <text x="412" y="620" class="stage-title">Model Export</text>
    <text x="412" y="663" class="body">Output-path selection and model conversion</text>
    <text x="412" y="700" class="note">Choose E2E / One-to-Many / Legacy output path</text>
    <text x="412" y="735" class="note">Convert PyTorch weights into mobile inference assets</text>
  </g>

  <path d="M790 769 L790 825" stroke="#315b7d" stroke-width="7" fill="none" marker-end="url(#arrow)" stroke-linecap="round"/>

  <!-- Stage 3 -->
  <g filter="url(#shadow)">
    <rect x="270" y="840" width="1040" height="168" rx="20" fill="url(#verificationStage)" stroke="#79ad83" stroke-width="3"/>
    <circle cx="338" cy="924" r="38" fill="#377b45"/>
    <text x="338" y="934" text-anchor="middle" class="num">3</text>
    <text x="412" y="900" class="stage-title">Intermediate and Final Model Assets</text>
    <text x="412" y="943" class="body">ONNX representation and NCNN param/bin file pair</text>
    <text x="412" y="980" class="note">Assets become inspectable before Android integration</text>
  </g>

  <path d="M790 1022 L790 1078" stroke="#315b7d" stroke-width="7" fill="none" marker-end="url(#arrow)" stroke-linecap="round"/>

  <!-- Stage 4 -->
  <g filter="url(#shadow)">
    <rect x="270" y="1093" width="1040" height="218" rx="20" fill="url(#verificationStage)" stroke="#79ad83" stroke-width="3"/>
    <circle cx="338" cy="1202" r="38" fill="#377b45"/>
    <text x="338" y="1212" text-anchor="middle" class="num">4</text>
    <text x="412" y="1165" class="stage-title">Structural Verification</text>
    <text x="412" y="1208" class="body">Check tensor shapes, branch organization, and column layout</text>
    <text x="412" y="1245" class="note">Cross-backend numerical consistency comparison</text>
    <text x="412" y="1280" class="note">Align tensor semantics with the Android parser</text>
  </g>

  <path d="M790 1325 L790 1382" stroke="#315b7d" stroke-width="7" fill="none" marker-end="url(#arrow)" stroke-linecap="round"/>

  <!-- Stage 5 -->
  <g filter="url(#shadow)">
    <rect x="270" y="1397" width="1040" height="205" rx="20" fill="url(#androidStage)" stroke="#d4a047" stroke-width="3"/>
    <circle cx="338" cy="1500" r="38" fill="#a66b15"/>
    <text x="338" y="1510" text-anchor="middle" class="num">5</text>
    <text x="412" y="1468" class="stage-title">Android Asset Deployment</text>
    <text x="412" y="1511" class="body">Uniformly named *.ncnn.{param,bin} assets</text>
    <text x="412" y="1548" class="note">Placed under app/src/main/assets/</text>
    <text x="412" y="1583" class="note">Asset names are aligned with task loading paths</text>
  </g>

  <path d="M790 1616 L790 1672" stroke="#315b7d" stroke-width="7" fill="none" marker-end="url(#arrow)" stroke-linecap="round"/>

  <!-- Stage 6 -->
  <g filter="url(#shadow)">
    <rect x="270" y="1687" width="1040" height="205" rx="20" fill="url(#androidStage)" stroke="#d4a047" stroke-width="3"/>
    <circle cx="338" cy="1790" r="38" fill="#a66b15"/>
    <text x="338" y="1800" text-anchor="middle" class="num">6</text>
    <text x="412" y="1758" class="stage-title">On-Device Loading and Execution</text>
    <text x="412" y="1801" class="body">Model loading -&gt; camera input -&gt; rendering output</text>
    <text x="412" y="1838" class="note">Java-JNI-C++-NCNN collaborative runtime path</text>
    <text x="412" y="1873" class="note">On-device execution is observed through real runs</text>
  </g>

  <path d="M790 1906 L790 1962" stroke="#315b7d" stroke-width="7" fill="none" marker-end="url(#arrow)" stroke-linecap="round"/>

  <!-- Stage 7 -->
  <g filter="url(#shadow)">
    <rect x="270" y="1977" width="1040" height="205" rx="20" fill="url(#diagnosisStage)" stroke="#8ca4b8" stroke-width="3"/>
    <circle cx="338" cy="2080" r="38" fill="#315b7d"/>
    <text x="338" y="2090" text-anchor="middle" class="num">7</text>
    <text x="412" y="2048" class="stage-title">Logging and Cross-Backend Comparison</text>
    <text x="412" y="2091" class="body">On-device log capture + structure tracing</text>
    <text x="412" y="2128" class="note">Python-side reference implementation comparison</text>
    <text x="412" y="2163" class="note">Localize deployment deviations across the pipeline</text>
  </g>

  <path d="M790 2196 L790 2252" stroke="#315b7d" stroke-width="7" fill="none" marker-end="url(#arrow)" stroke-linecap="round"/>

  <!-- Stage 8 -->
  <g filter="url(#shadow)">
    <rect x="270" y="2267" width="1040" height="205" rx="20" fill="url(#diagnosisStage)" stroke="#8ca4b8" stroke-width="3"/>
    <circle cx="338" cy="2370" r="38" fill="#315b7d"/>
    <text x="338" y="2380" text-anchor="middle" class="num">8</text>
    <text x="412" y="2338" class="stage-title">Regression Validation and Result Summary</text>
    <text x="412" y="2381" class="body">Latency and coverage regression</text>
    <text x="412" y="2418" class="note">Validation evidence is summarized from regression outputs</text>
    <text x="412" y="2453" class="note">Concrete case artifacts instantiate the abstract loop</text>
  </g>

  <!-- Iterative closed-loop feedback -->
  <path d="M1326 2370 C1626 2370 1648 652 1326 652" stroke="#a66b15" stroke-width="7" fill="none" marker-end="url(#loopArrow)" stroke-linecap="round"/>
  <rect x="1388" y="1380" width="300" height="126" rx="18" fill="#fff8eb" stroke="#d4a047" stroke-width="3"/>
  <text x="1538" y="1427" text-anchor="middle" class="loop-title">repair and iterate</text>
  <text x="1538" y="1463" text-anchor="middle" class="loop-text">update export, parser,</text>
  <text x="1538" y="1495" text-anchor="middle" class="loop-text">or deployment assets</text>

  <rect x="270" y="2535" width="1040" height="2" fill="#c8d6e2"/>
  <text x="270" y="2575" class="loop-text">Closed loop output: export, structural verification, asset deployment, comparative diagnosis, and regression validation.</text>
</svg>
