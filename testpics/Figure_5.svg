<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="180mm" height="178mm" viewBox="0 0 1800 1780" role="img" aria-labelledby="title desc">
  <title id="title">Figure 5. Comparison of Input Patterns and Detection Results Before and After the Preprocessing Fix</title>
  <desc id="desc">A two-column comparison showing that stride-aligned padding produces a 640 by 384 tensor and false detections, whereas strict square letterbox padding produces a 640 by 640 tensor and eliminates empty-scene false detections.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f9fbfd"/>
      <stop offset="100%" stop-color="#eef4f7"/>
    </linearGradient>
    <linearGradient id="beforeStage" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff6e4"/>
      <stop offset="100%" stop-color="#ffe2be"/>
    </linearGradient>
    <linearGradient id="afterStage" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ebf8f0"/>
      <stop offset="100%" stop-color="#daf0e2"/>
    </linearGradient>
    <linearGradient id="neutralStage" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#edf5ff"/>
      <stop offset="100%" stop-color="#dceafa"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="9" stdDeviation="9" flood-color="#23303a" flood-opacity="0.14"/>
    </filter>
    <marker id="arrowBlue" markerWidth="22" markerHeight="22" refX="18" refY="11" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2,2 L20,11 L2,20 Z" fill="#315b7d"/>
    </marker>
    <marker id="arrowOrange" markerWidth="22" markerHeight="22" refX="18" refY="11" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2,2 L20,11 L2,20 Z" fill="#a66b15"/>
    </marker>
    <marker id="arrowGreen" markerWidth="22" markerHeight="22" refX="18" refY="11" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2,2 L20,11 L2,20 Z" fill="#377b45"/>
    </marker>
    <style><![CDATA[
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 41px; font-weight: 700; fill: #17212b; }
      .subtitle { font-family: Arial, Helvetica, sans-serif; font-size: 25px; fill: #536170; }
      .column-title { font-family: Arial, Helvetica, sans-serif; font-size: 30px; font-weight: 700; fill: #182430; }
      .stage-title { font-family: Arial, Helvetica, sans-serif; font-size: 26px; font-weight: 700; fill: #182430; }
      .body { font-family: Arial, Helvetica, sans-serif; font-size: 22px; fill: #314151; }
      .note { font-family: Arial, Helvetica, sans-serif; font-size: 20px; fill: #526273; }
      .metric-bad { font-family: Arial, Helvetica, sans-serif; font-size: 23px; font-weight: 700; fill: #8a4c14; }
      .metric-good { font-family: Arial, Helvetica, sans-serif; font-size: 23px; font-weight: 700; fill: #2f6f3e; }
      .num { font-family: Arial, Helvetica, sans-serif; font-size: 27px; font-weight: 700; fill: #ffffff; }
    ]]></style>
  </defs>

  <rect x="0" y="0" width="1800" height="1780" fill="url(#background)"/>
  <rect x="100" y="78" width="1600" height="152" rx="18" fill="#ffffff" stroke="#d7e0ea" stroke-width="3"/>
  <text x="900" y="138" text-anchor="middle" class="title">Preprocessing Fix: Input Pattern and Detection Result</text>
  <text x="900" y="184" text-anchor="middle" class="subtitle">Strict square letterbox restores the training-time input assumption</text>

  <g filter="url(#shadow)">
    <rect x="130" y="300" width="740" height="1250" rx="20" fill="#ffffff" stroke="#e0c48f" stroke-width="3"/>
    <text x="500" y="360" text-anchor="middle" class="column-title">Before the Fix</text>
    <text x="500" y="398" text-anchor="middle" class="note">stride-aligned padding drifts from training input</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="930" y="300" width="740" height="1250" rx="20" fill="#ffffff" stroke="#9bc7a3" stroke-width="3"/>
    <text x="1300" y="360" text-anchor="middle" class="column-title">After the Fix</text>
    <text x="1300" y="398" text-anchor="middle" class="note">strict 640x640 letterbox restores consistency</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="240" y="470" width="520" height="122" rx="18" fill="url(#neutralStage)" stroke="#89a9cf" stroke-width="3"/>
    <circle cx="292" cy="531" r="31" fill="#315b7d"/>
    <text x="292" y="540" text-anchor="middle" class="num">1</text>
    <text x="350" y="516" class="stage-title">Camera frame</text>
    <text x="350" y="552" class="body">1920x1080 input scene</text>
  </g>
  <path d="M500 606 L500 668" stroke="#315b7d" stroke-width="6" fill="none" marker-end="url(#arrowBlue)" stroke-linecap="round"/>
  <g filter="url(#shadow)">
    <rect x="240" y="700" width="520" height="138" rx="18" fill="url(#beforeStage)" stroke="#d4a047" stroke-width="3"/>
    <circle cx="292" cy="769" r="31" fill="#a66b15"/>
    <text x="292" y="778" text-anchor="middle" class="num">2</text>
    <text x="350" y="746" class="stage-title">Stride-aligned padding</text>
    <text x="350" y="782" class="body">long-side resize only</text>
    <text x="350" y="816" class="note">input tensor becomes 640x384</text>
  </g>
  <path d="M500 852 L500 914" stroke="#a66b15" stroke-width="6" fill="none" marker-end="url(#arrowOrange)" stroke-linecap="round"/>
  <g filter="url(#shadow)">
    <rect x="240" y="946" width="520" height="178" rx="18" fill="url(#beforeStage)" stroke="#d4a047" stroke-width="3"/>
    <circle cx="292" cy="1035" r="31" fill="#a66b15"/>
    <text x="292" y="1044" text-anchor="middle" class="num">3</text>
    <text x="350" y="1004" class="stage-title">Input-distribution drift</text>
    <text x="350" y="1040" class="body">background scores rise systematically</text>
    <text x="350" y="1074" class="metric-bad">p50 = 0.84-0.96</text>
    <text x="350" y="1108" class="metric-bad">frac_gt090 = 0.41-0.58</text>
  </g>
  <path d="M500 1138 L500 1200" stroke="#a66b15" stroke-width="6" fill="none" marker-end="url(#arrowOrange)" stroke-linecap="round"/>
  <g filter="url(#shadow)">
    <rect x="240" y="1232" width="520" height="178" rx="18" fill="#fff8eb" stroke="#d4a047" stroke-width="3"/>
    <text x="500" y="1294" text-anchor="middle" class="stage-title">Detection result</text>
    <text x="500" y="1340" text-anchor="middle" class="body">all 10 classes appear in empty scenes</text>
    <text x="500" y="1382" text-anchor="middle" class="metric-bad">false detections remain reproducible</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1040" y="470" width="520" height="122" rx="18" fill="url(#neutralStage)" stroke="#89a9cf" stroke-width="3"/>
    <circle cx="1092" cy="531" r="31" fill="#315b7d"/>
    <text x="1092" y="540" text-anchor="middle" class="num">1</text>
    <text x="1150" y="516" class="stage-title">Camera frame</text>
    <text x="1150" y="552" class="body">same 1920x1080 input scene</text>
  </g>
  <path d="M1300 606 L1300 668" stroke="#315b7d" stroke-width="6" fill="none" marker-end="url(#arrowBlue)" stroke-linecap="round"/>
  <g filter="url(#shadow)">
    <rect x="1040" y="700" width="520" height="138" rx="18" fill="url(#afterStage)" stroke="#79ad83" stroke-width="3"/>
    <circle cx="1092" cy="769" r="31" fill="#377b45"/>
    <text x="1092" y="778" text-anchor="middle" class="num">2</text>
    <text x="1150" y="746" class="stage-title">Square letterbox</text>
    <text x="1150" y="782" class="body">symmetric padding with pad_value = 114</text>
    <text x="1150" y="816" class="note">input tensor becomes 640x640</text>
  </g>
  <path d="M1300 852 L1300 914" stroke="#377b45" stroke-width="6" fill="none" marker-end="url(#arrowGreen)" stroke-linecap="round"/>
  <g filter="url(#shadow)">
    <rect x="1040" y="946" width="520" height="178" rx="18" fill="url(#afterStage)" stroke="#79ad83" stroke-width="3"/>
    <circle cx="1092" cy="1035" r="31" fill="#377b45"/>
    <text x="1092" y="1044" text-anchor="middle" class="num">3</text>
    <text x="1150" y="1004" class="stage-title">Distribution restored</text>
    <text x="1150" y="1040" class="body">background scores return near zero</text>
    <text x="1150" y="1074" class="metric-good">p50 &lt; 0.0001</text>
    <text x="1150" y="1108" class="metric-good">frac_gt090 &lt; 0.000001</text>
  </g>
  <path d="M1300 1138 L1300 1200" stroke="#377b45" stroke-width="6" fill="none" marker-end="url(#arrowGreen)" stroke-linecap="round"/>
  <g filter="url(#shadow)">
    <rect x="1040" y="1232" width="520" height="178" rx="18" fill="#f3fbf5" stroke="#79ad83" stroke-width="3"/>
    <text x="1300" y="1294" text-anchor="middle" class="stage-title">Detection result</text>
    <text x="1300" y="1340" text-anchor="middle" class="body">empty-scene false detections disappear</text>
    <text x="1300" y="1382" text-anchor="middle" class="metric-good">target-present scenes stay correct</text>
  </g>

  <rect x="260" y="1620" width="1280" height="2" fill="#c8d6e2"/>
  <text x="900" y="1664" text-anchor="middle" class="note">The repair changes preprocessing, not the model weights: the same scene is mapped back to the square tensor assumed during training.</text>
</svg>